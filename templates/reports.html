<style>body{display:grid!important;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.persistent-sidebar{grid-column:1;grid-row:1;background:linear-gradient(180deg,#12375b,#0c2945);color:#fff;padding:28px 17px}.persistent-sidebar h1{font-size:18px;line-height:1.35;margin:0 8px 34px}.persistent-sidebar nav{display:grid;gap:5px}.persistent-sidebar a,.persistent-sidebar button{color:#d6e3ef;text-decoration:none;border:0;background:transparent;font:14px Segoe UI,Arial,sans-serif;text-align:left;padding:11px 12px;border-radius:6px;cursor:pointer}.persistent-sidebar a:hover,.persistent-sidebar a.active{background:#ffffff24;color:#fff}.persistent-sidebar button{margin-top:18px;color:#ffd0d0}@media(max-width:650px){body{display:block!important}.persistent-sidebar{padding:18px}.persistent-sidebar h1{margin-bottom:15px}.persistent-sidebar nav{grid-template-columns:repeat(2,1fr)}}@media print{.persistent-sidebar{display:none!important}body{display:block!important}}</style>
<script>document.addEventListener('DOMContentLoaded',()=>{const path=location.pathname,links=[['/dashboard','Dashboard'],['/equipment','Equipment'],['/borrowers','Borrowers'],['/borrowings','Borrowing Transactions'],['/admin/borrowing-requests','Borrowing Requests'],['/returns','Returns'],['/reports','Reports'],['/audit-logs','Audit Trail'],['/about','About']],side=document.createElement('aside');side.className='persistent-sidebar';side.innerHTML='<h1>Barangay Equipment<br>Borrowing System</h1><nav>'+links.map(([href,label])=>'<a class="'+(href===path?'active':'')+'" href="'+href+'">'+label+'</a>').join('')+'<button type="button" onclick="if(confirm(\'Are you sure you want to log out?\')) location=\'/logout\'">Logout</button></nav>';document.body.prepend(side)})</script><!doctype html><html><head><meta charset="UTF-8"><title>Reports</title><style>body{font:14px Segoe UI,Arial;background:#f2f6fa;margin:0;color:#172b42}.app{max-width:1200px;margin:auto;padding:25px}.controls,.report{background:#fff;border:1px solid #dce5ee;border-radius:9px;padding:17px;margin:15px 0}.row{display:flex;gap:9px;flex-wrap:wrap}input,select,button{padding:9px;border:1px solid #dce5ee;border-radius:5px;font:inherit}button{background:#1674c9;color:#fff;font-weight:600;cursor:pointer}.secondary{background:#edf3f8;color:#245172}table{border-collapse:collapse;width:100%;margin-top:15px}th,td{padding:9px;border-bottom:1px solid #dce5ee;text-align:left}th{background:#f4f7fa}.meta{color:#66778a}@media print{body{background:#fff}.controls,.no-print{display:none}.app{max-width:none;padding:0}.report{border:0}.print-title{display:block}@page{margin:15mm;@bottom-center{content:"Page " counter(page) " of " counter(pages)}}}</style></head><body><main class="app"><div class="no-print"><h1>Reports</h1><p class="meta">Barangay Equipment Borrowing System ·</p><section class="controls"><div class="row"><select id="type"><option value="inventory">Equipment Inventory Report</option><option value="available">Available Equipment Report</option><option value="active">Active Borrowings Report</option><option value="current_borrowers">Current Borrowers Report</option><option value="returned">Returned Transactions Report</option><option value="history">Borrower History Report</option><option value="transaction">Borrowing Transaction Report</option></select><input id="search" placeholder="Search borrower, equipment, or loan ID"><select id="status"><option value="">All statuses</option><option>Active</option><option>Partially Returned</option><option>Returned</option><option>Cancelled</option><option>Available</option><option>Low Stock</option><option>Out of Stock</option></select><input id="start" type="date"><input id="end" type="date"><select id="borrower"><option value="">All borrowers</option></select><button onclick="preview()">Preview</button><button class="secondary" onclick="window.print()">Print</button></div></section></div><section class="report"><h1 id="title">Equipment Inventory Report</h1><p class="meta">Barangay Equipment Borrowing System · Generated <span id="generated"></span></p><table><thead id="head"></thead><tbody id="body"><tr><td>Choose Preview to generate a report.</td></tr></tbody></table></section></main><script>const $=x=>document.getElementById(x);const names={inventory:'Equipment Inventory Report',available:'Available Equipment Report',active:'Active Borrowings Report',current_borrowers:'Current Borrowers Report',returned:'Returned Transactions Report',history:'Borrower History Report',transaction:'Borrowing Transaction Report'};async function init(){let r=await fetch('/api/borrowers'),a=await r.json();$('borrower').innerHTML='<option value="">All borrowers</option>'+a.map(x=>`<option value="${x.borrower_id}">${x.full_name}</option>`).join('')}async function preview(){let p=new URLSearchParams({type:$('type').value,search:$('search').value,status:$('status').value,start_date:$('start').value,end_date:$('end').value,borrower_id:$('borrower').value});let r=await fetch('/api/reports?'+p),rows=await r.json();$('title').textContent=names[$('type').value];$('generated').textContent=new Date().toLocaleString();let cols=rows.length?Object.keys(rows[0]):[];$('head').innerHTML='<tr>'+cols.map(x=>`<th>${x}</th>`).join('')+'</tr>';$('body').innerHTML=rows.length?rows.map(x=>'<tr>'+cols.map(c=>`<td>${x[c]??'—'}</td>`).join('')+'</tr>').join('<tr><td colspan="99">&nbsp;</td></tr>'):'<tr><td>No report records found.</td></tr>'}for(let id of ['type','status','borrower'])$(id).addEventListener('change',preview);init();preview();</script></body></html>
