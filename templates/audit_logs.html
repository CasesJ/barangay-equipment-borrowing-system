<style>body{display:grid!important;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.persistent-sidebar{grid-column:1;grid-row:1;background:linear-gradient(180deg,#12375b,#0c2945);color:#fff;padding:28px 17px}.persistent-sidebar h1{font-size:18px;line-height:1.35;margin:0 8px 34px}.persistent-sidebar nav{display:grid;gap:5px}.persistent-sidebar a,.persistent-sidebar button{color:#d6e3ef;text-decoration:none;border:0;background:transparent;font:14px Segoe UI,Arial,sans-serif;text-align:left;padding:11px 12px;border-radius:6px;cursor:pointer}.persistent-sidebar a:hover,.persistent-sidebar a.active{background:#ffffff24;color:#fff}.persistent-sidebar button{margin-top:18px;color:#ffd0d0}@media(max-width:650px){body{display:block!important}.persistent-sidebar{padding:18px}.persistent-sidebar h1{margin-bottom:15px}.persistent-sidebar nav{grid-template-columns:repeat(2,1fr)}}@media print{.persistent-sidebar{display:none!important}body{display:block!important}}</style>
<script>document.addEventListener('DOMContentLoaded',()=>{const path=location.pathname,links=[['/dashboard','Dashboard'],['/equipment','Equipment'],['/borrowers','Borrowers'],['/borrowings','Borrowing Transactions'],['/admin/borrowing-requests','Borrowing Requests'],['/returns','Returns'],['/reports','Reports'],['/audit-logs','Audit Trail'],['/about','About']],side=document.createElement('aside');side.className='persistent-sidebar';side.innerHTML='<h1>Barangay Equipment<br>Borrowing System</h1><nav>'+links.map(([href,label])=>'<a class="'+(href===path?'active':'')+'" href="'+href+'">'+label+'</a>').join('')+'<button type="button" onclick="if(confirm(\'Are you sure you want to log out?\')) location=\'/logout\'">Logout</button></nav>';document.body.prepend(side)})</script><!doctype html><html><head><meta charset="UTF-8"><title>Audit Trail</title><style>body{margin:0;background:#f2f6fa;color:#172b42;font:14px Segoe UI,Arial}.app{max-width:1200px;margin:auto;padding:27px}.panel{background:#fff;border:1px solid #dce5ee;border-radius:9px;padding:17px;margin-top:16px}.row{display:flex;gap:9px;flex-wrap:wrap}input,select,button{padding:9px;border:1px solid #dce5ee;border-radius:5px;font:inherit}input{min-width:180px}button{background:#1674c9;color:#fff;font-weight:600;cursor:pointer}.secondary{background:#edf3f8;color:#245172}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:11px;border-bottom:1px solid #dce5ee;text-align:left}th{background:#f4f7fa}.muted{color:#66778a}</style></head><body><main class="app"><h1>Audit Trail</h1><p class="muted">Track important system actions performed by authorized users.</p><section class="panel"><div class="row"><input id="search" placeholder="User, description, or record ID"><select id="action"><option value="">All actions</option><option>CREATE</option><option>UPDATE</option><option>DELETE</option><option>RETURN</option></select><select id="table"><option value="">All tables</option><option value="equipment">Equipment</option><option value="borrowers">Borrowers</option><option value="borrowings">Borrowings</option><option value="users">Users</option></select><input id="start" type="date"><input id="end" type="date"><button class="secondary" onclick="clearFilters()">Clear Filters</button><button onclick="loadLogs()">Refresh</button></div><table><thead><tr><th>Date/Time</th><th>User</th><th>Action</th><th>Table</th><th>Record</th><th>Description</th></tr></thead><tbody id="logs"><tr><td colspan="6">Loading audit records…</td></tr></tbody></table></section></main><script>const $=id=>document.getElementById(id);async function loadLogs(){let p=new URLSearchParams({search:$('search').value,action:$('action').value,table:$('table').value,start_date:$('start').value,end_date:$('end').value}),r=await fetch('/api/audit-logs?'+p),rows=await r.json();$('logs').innerHTML=rows.length?rows.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.full_name} <span class="muted">(${x.username})</span></td><td>${x.action}</td><td>${x.table_name}</td><td>${x.record_id??'—'}</td><td>${x.description??'—'}</td></tr>`).join(''):'<tr><td colspan="6">No audit records found.</td></tr>'}function clearFilters(){for(let id of ['search','action','table','start','end'])$(id).value='';loadLogs()}for(let id of ['search','action','table','start','end'])$(id).addEventListener('change',loadLogs);$('search').addEventListener('input',loadLogs);loadLogs();</script></body></html>
