<style>body{display:grid!important;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.persistent-sidebar{grid-column:1;grid-row:1;background:linear-gradient(180deg,#12375b,#0c2945);color:#fff;padding:28px 17px}.persistent-sidebar h1{font-size:18px;line-height:1.35;margin:0 8px 34px}.persistent-sidebar nav{display:grid;gap:5px}.persistent-sidebar a,.persistent-sidebar button{color:#d6e3ef;text-decoration:none;border:0;background:transparent;font:14px Segoe UI,Arial,sans-serif;text-align:left;padding:11px 12px;border-radius:6px;cursor:pointer}.persistent-sidebar a:hover,.persistent-sidebar a.active{background:#ffffff24;color:#fff}.persistent-sidebar button{margin-top:18px;color:#ffd0d0}@media(max-width:650px){body{display:block!important}.persistent-sidebar{padding:18px}.persistent-sidebar h1{margin-bottom:15px}.persistent-sidebar nav{grid-template-columns:repeat(2,1fr)}}@media print{.persistent-sidebar{display:none!important}body{display:block!important}}</style>
<script>document.addEventListener('DOMContentLoaded',()=>{const path=location.pathname,links=[['/dashboard','Dashboard'],['/equipment','Equipment'],['/borrowers','Borrowers'],['/borrowings','Borrowing Transactions'],['/admin/borrowing-requests','Borrowing Requests'],['/returns','Returns'],['/reports','Reports'],['/audit-logs','Audit Trail'],['/about','About']],side=document.createElement('aside');side.className='persistent-sidebar';side.innerHTML='<h1>Barangay Equipment<br>Borrowing System</h1><nav>'+links.map(([href,label])=>'<a class="'+(href===path?'active':'')+'" href="'+href+'">'+label+'</a>').join('')+'<button type="button" onclick="if(confirm(\'Are you sure you want to log out?\')) location=\'/logout\'">Logout</button></nav>';document.body.prepend(side)})</script><!doctype html><html><head><meta charset="UTF-8"><title>Returns & Transaction Search</title><style>body{font:14px Segoe UI,Arial;background:#f2f6fa;color:#172b42;margin:0}.app{max-width:1150px;margin:auto;padding:25px}.panel{background:white;border:1px solid #dce5ee;border-radius:9px;padding:17px;margin:15px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,select,textarea{padding:9px;border:1px solid #dce5ee;border-radius:5px;font:inherit}button{padding:9px 13px;border:0;border-radius:5px;background:#1674c9;color:white;font-weight:600;cursor:pointer}.secondary{background:#edf3f8;color:#245172}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{padding:10px;border-bottom:1px solid #dce5ee;text-align:left}.message{padding:10px;background:#effaf3}.error{background:#fff1f1;color:#a51d1d}.hide{display:none}</style></head><body><main class="app"><h1>Equipment Returns</h1><p>Search, filter, sort, and record equipment returns.</p>{% set text=request.args.get('message') %}{% if text %}<p class="message">{{ text }}</p>{% endif %}<section class="panel"><div class="row"><input id="search" placeholder="Loan ID, borrower, or equipment"><select id="status"><option value="">All outstanding loans</option><option>Active</option><option>Partially Returned</option></select><select id="date_field"><option value="borrowed">Borrow date</option><option value="expected">Expected return</option><option value="actual">Actual return</option></select><input id="start_date" type="date"><input id="end_date" type="date"><select id="sort"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="borrower">Borrower name</option><option value="status">Status</option><option value="expected">Expected return date</option></select><button class="secondary" onclick="clearFilters()">Clear Filters</button><button onclick="loadLoans()">Refresh</button></div><table><thead><tr><th>ID</th><th>Borrower</th><th>Borrowed</th><th>Expected Return</th><th>Status</th><th></th></tr></thead><tbody id="loans"></tbody></table></section><form id="form" class="hide" method="post" action="/returns/save"><input id="loan_id" name="borrowing_id" type="hidden"><input id="items" name="items" type="hidden"><section class="panel"><h2 id="loan_title"></h2><table><thead><tr><th>Equipment</th><th>Borrowed</th><th>Returned</th><th>Remaining</th><th>Return quantity</th></tr></thead><tbody id="loan_items"></tbody></table><div class="row"><label>Return date <input name="return_date" type="date" value="{{ today }}" max="{{ today }}"></label><textarea name="notes" placeholder="Notes (optional)"></textarea><button>Save Return</button><button type="button" class="secondary" onclick="form.classList.add('hide')">Close</button></div></section></form></main><script>
const $=id=>document.getElementById(id);let selected;async function loadLoans(){let p=new URLSearchParams({search:$('search').value,status:$('status').value,date_field:$('date_field').value,start_date:$('start_date').value,end_date:$('end_date').value,sort:$('sort').value}),r=await fetch('/api/returnable-borrowings?'+p),rows=await r.json();$('loans').innerHTML=rows.length?rows.map(x=>`<tr><td>#${x.borrowing_id}</td><td>${x.full_name}</td><td>${String(x.borrowed_at).slice(0,10)}</td><td>${x.expected_return_date}</td><td>${x.status}</td><td><button onclick="selectLoan(${x.borrowing_id})">Select</button></td></tr>`).join(''):'<tr><td colspan="6">No active borrowing transactions found.</td></tr>'}function clearFilters(){for(let id of ['search','status','start_date','end_date'])$(id).value='';$('date_field').value='borrowed';$('sort').value='newest';loadLoans()}async function selectLoan(id){let r=await fetch('/api/borrowings/'+id+'/items');if(!r.ok){alert('Unable to load the selected transaction.');return}selected=await r.json();$('form').classList.remove('hide');$('loan_id').value=id;$('loan_title').textContent=`Loan #${id} — ${selected.full_name}`;$('loan_items').innerHTML=selected.items.map(x=>`<tr><td>${x.equipment_name}</td><td>${x.quantity_borrowed}</td><td>${x.quantity_returned}</td><td>${x.remaining_quantity}</td><td><input class="q" data-id="${x.borrowing_item_id}" type="number" min="0" max="${x.remaining_quantity}" value="0" ${x.remaining_quantity===0?'disabled':''}></td></tr>`).join('')}$('form').addEventListener('submit',e=>{let a=[...document.querySelectorAll('.q')].map(x=>({borrowing_item_id:+x.dataset.id,quantity:+x.value})).filter(x=>x.quantity>0);if(!a.length){e.preventDefault();alert('Enter a return quantity greater than zero.');return}$('items').value=JSON.stringify(a);if(!confirm('Save this return?'))e.preventDefault()});for(let id of ['search','status','date_field','start_date','end_date','sort'])$(id).addEventListener('change',loadLoans);$('search').addEventListener('input',loadLoans);loadLoans();
</script></body></html>
