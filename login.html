<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    :root { --blue: #1760c9; --button: #477fe3; --facebook: #4267b2; --ink: #061b40; --muted: #8091a9; --line: #d9dce2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: linear-gradient(135deg, #1768d2 0%, #1256bb 100%); }
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 56px 24px; }
    .auth-grid { width: min(100%, 412px); }
    .card { min-height: 726px; overflow: hidden; position: relative; background: radial-gradient(ellipse 245px 245px at -13% -8%, transparent 0 42%, rgba(102, 193, 238, .35) 42.5% 55%, transparent 55.5%), radial-gradient(ellipse 290px 260px at 111% 109%, transparent 0 38%, rgba(102, 193, 238, .35) 38.5% 51%, transparent 51.5%), #b8e3f7; border-radius: 43px; padding: 68px 35px 42px; box-shadow: 0 18px 32px rgba(2, 37, 103, .13); }
    h1 { margin: 0 0 18px; text-align: center; font-size: 34px; line-height: 1.2; font-weight: 700; }
    form { display: grid; gap: 12px; margin-top: 26px; }
    .field { position: relative; }
    input { width: 100%; height: 54px; padding: 0 20px; border: 0; border-radius: 15px; outline: none; color: var(--ink); background: #fff; font-size: 16px; transition: box-shadow .2s; }
    input::placeholder { color: #99a9c1; }
    input:focus { border-color: var(--button); box-shadow: 0 0 0 3px rgba(8, 121, 209, .12); }
    .field input[type="password"], .field input[data-password] { padding-right: 35px; }
    .eye { position: absolute; top: 50%; right: 18px; width: 24px; height: 24px; transform: translateY(-50%); border: 0; padding: 0; background: transparent; color: #ff4d57; cursor: pointer; }
    .eye svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    .forgot, .switch-line { margin: 3px 0 1px; text-align: center; font-size: 16px; font-weight: 700; color: var(--ink); }
    .forgot { text-align: left; font-weight: 400; }
    a { color: #1265e6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .primary { height: 56px; margin-top: 14px; border: 0; border-radius: 16px; background: var(--button); color: #fff; font-size: 19px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 12px rgba(43, 101, 201, .25); transition: filter .2s; }
    .primary:hover { filter: brightness(.92); }
    .form-message { display: none; margin: 0; padding: 9px 10px; border: 1px solid #f1b7b7; border-radius: 5px; background: #fff1f1; color: #a51d1d; font-size: 11px; line-height: 1.35; }
    .form-message.visible { display: block; }
    .divider { display: none; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: #e2e3e6; }
    .socials { display: none; }
    .social { height: 34px; display: flex; align-items: center; justify-content: center; gap: 38px; position: relative; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: #818896; font-size: 12px; cursor: pointer; }
    .social:hover { background: #f8fafc; }
    .social.facebook { border-color: var(--facebook); background: var(--facebook); color: #fff; }
    .social.facebook:hover { background: #38599c; }
    .social-icon { position: absolute; left: 10px; width: 17px; height: 17px; display: grid; place-items: center; font-weight: bold; }
    .facebook .social-icon { border-radius: 50%; background: #fff; color: #4267b2; font-family: Arial, sans-serif; font-size: 16px; line-height: 17px; }
    .google-icon { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; }
    .google-icon span:nth-child(1) { color: #4285f4; }.google-icon span:nth-child(2) { color: #ea4335; }.google-icon span:nth-child(3) { color: #fbbc05; }.google-icon span:nth-child(4) { color: #34a853; }.google-icon span:nth-child(5) { color: #4285f4; }.google-icon span:nth-child(6) { color: #ea4335; }
    @media (max-width: 620px) { .auth-page { padding: 32px 20px; } .card { min-height: min(726px, calc(100vh - 64px)); padding: 58px 35px 36px; } }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-grid" aria-label="Account access">
      <article class="card login">
        <h1>Login</h1>
        <form action="/login" method="post">
          <p id="auth-message" class="form-message" role="alert" aria-live="assertive"></p>
          <label class="field"><input type="text" name="identity" placeholder="Username or email" aria-label="Username or email" autocomplete="username" required></label>
          <label class="field">
            <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required data-password>
            <button class="eye" type="button" aria-label="Show password" onclick="togglePassword(this)"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 4.2A10.9 10.9 0 0112 4c5.5 0 9 5.2 9 8s-1.2 3.6-2.7 4.9M6.2 6.2C4.2 7.7 3 10.1 3 12c0 2.8 3.5 8 9 8 1.1 0 2.1-.2 3-.6"/></svg></button>
          </label>
          <p class="forgot"><a href="#">Forgot password?</a></p>
          <button class="primary" type="submit">Login</button>
          <p class="switch-line">Don't have an account? <a href="signup.html">Signup</a></p>
        </form>
        <div class="divider">Or</div>
        <div class="socials"><button class="social facebook" type="button"><span class="social-icon">f</span>Login with Facebook</button><button class="social" type="button"><span class="social-icon google-icon"><span>G</span></span>Login with Google</button></div>
      </article>
    </section>
  </main>
  <script>
    function togglePassword(button) { const input = button.parentElement.querySelector('input'); const show = input.type === 'password'; input.type = show ? 'text' : 'password'; button.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); }
    const authMessage = new URLSearchParams(window.location.search).get('message');
    if (authMessage) { const message = document.getElementById('auth-message'); message.textContent = authMessage; message.classList.add('visible'); }
  </script>
</body>
</html>
